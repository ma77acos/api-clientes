# Perfil "test" — usado por @SpringBootTest
spring.datasource.url=jdbc:h2:mem:reservas_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

server.port=0
server.servlet.context-path=/
cors.allowed.origins=http://localhost:3000
app.frontend-url=http://localhost:3000

spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@localhost
spring.mail.password=test

jwt.secret=test-secret-key-for-unit-tests-must-be-long-enough-32chars
jwt.expiration=3600000
jwt.refresh-expiration=604800000

mercadopago.buyer-pays-fee=true
mercadopago.app-id=test-app-id
mercadopago.client-secret=test-client-secret
mercadopago.sponsor-id=0
mercadopago.sponsorId=0
mercadopago.redirect-uri=http://localhost/callback
mercadopago.public-key=TEST-public
mercadopago.access-token=TEST-token
mercadopago.webhook-secret=test-webhook
mercadopago.platform-fee-percentage=5.0
mercadopago.platform-fee-percentage-new=0.05
mercadopago.notification-url=http://localhost/webhook

logging.level.root=WARN
logging.level.com.reservas=WARN
