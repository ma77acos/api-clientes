# ============================================================
#                    CONFIGURACIùN GENERAL
# ============================================================
spring.application.name=reservas-canchas
# Override local: --spring.profiles.active=dev,local  |  prod: -Dspring.profiles.active=prod
spring.profiles.active=dev

# ============================================================
#                    BASE DE DATOS
# ============================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reservas_db}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Argentina/Buenos_Aires
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# ============================================================
#                    JPA / HIBERNATE
# ============================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
#                    SERVER
# ============================================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# ============================================================
#                    JWT
# ============================================================
jwt.secret=${JWT_SECRET:MiClaveSecretaSuperSeguraParaJWTDebeSerMuyLargaYCompleja2024!@#$%}
jwt.expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# ============================================================
#                    MAIL
# ============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:fastbuild.dev@gmail.com}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.frontend-url=${FRONTEND_URL:http://localhost:3000}

# ============================================================
#                    LOGGING
# ============================================================
logging.level.root=INFO
logging.level.com.reservas=${LOG_LEVEL:DEBUG}
logging.level.com.mercadopago=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
