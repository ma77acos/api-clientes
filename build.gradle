plugins {
	id 'java'
	id 'war'
	id 'org.springframework.boot' version '3.2.0'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.reservas'
version = '1.0.0'

java {
	sourceCompatibility = '17'
	targetCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot Starters
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-mail'

	implementation 'com.mercadopago:sdk-java:2.1.29'

	// MySQL Driver
	runtimeOnly 'com.mysql:mysql-connector-j'

	// H2 solo para tests
	testRuntimeOnly 'com.h2database:h2'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.5.5.Final'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// DevTools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Tomcat embebido en local/JAR; provided solo si se pide WAR para Tomcat externo (-Pprod)
	if (project.hasProperty('prod')) {
		providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
	} else {
		implementation 'org.springframework.boot:spring-boot-starter-tomcat'
	}

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootWar') {
	archiveBaseName = 'turnos-control'
	archiveVersion = ''
	dependsOn test
}

tasks.named('bootJar') {
	enabled = true
	archiveBaseName = 'turnos-control'
	archiveVersion = ''
	dependsOn test
}

bootRun {
	jvmArgs = [
		'-Djava.awt.headless=true',
		'-Dfile.encoding=UTF-8',
		'-Dspring.output.ansi.enabled=ALWAYS'
	]
}

// ==================== Tareas personalizadas ====================

tasks.register('warProd') {
	dependsOn test, bootWar
	doLast {
		println '✅ WAR generado para PRODUCCIÓN'
		println '📦 Archivo: build/libs/turnos-control.war'
	}
}

tasks.register('jarProd') {
	dependsOn test, bootJar
	doLast {
		println '✅ JAR generado para PRODUCCIÓN'
		println '📦 Archivo: build/libs/turnos-control.jar'
		println '🔧 Ejecutar con: java -jar -Dspring.profiles.active=prod build/libs/turnos-control.jar'
	}
}
